<div class="cards-container" style="display: flex; flex-direction: row; gap: 60px; width: 100%; justify-content: center; flex-wrap: wrap;">

<div class="flip-card">

</div>
<div class="flip-card-back">
<img alt="Nexmart Membership Card Back" src="./Green White Professional Minimal Company Business Card/Card1_back.png" style="width: 100%; height: 100%; object-fit: contain;"/>
<div class="glossy-overlay"></div>
</div>
</div>
</div>
<p style="color: #94A3B8; font-size: 14px;">Hover or tap to flip</p>
</div>
<!-- Card 2: Nexmart Prepaid Card -->
<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; flex: 1; min-width: 300px; max-width: 450px;">
<h3 style="color: #FFFFFF; font-size: 24px; font-weight: 600;">Prepaid Card</h3>
<div class="flip-card">
<div class="flip-card-inner">
<div class="flip-card-front">
<img alt="Nexmart Prepaid Card Front" src="./Green White Professional Minimal Company Business Card/Card2_Front.png" style="width: 100%; height: 100%; object-fit: contain;"/>

</div>

<style>
        .cards-container {
            display: flex;
            flex-direction: row;
            gap: 60px;
            width: 100%;
            justify-content: center;
        }
        @media (max-width: 768px) {
            .cards-container {
                flex-direction: column;
                align-items: center;
            }
        }
        .flip-card {
            background-color: transparent;
            width: 100%;
            aspect-ratio: 1.586;
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            
            box-shadow: none;
        }
        /* Mobile touch support via :active and :focus, desktop via :hover */
        .flip-card:hover .flip-card-inner,
        .flip-card:active .flip-card-inner,
        .flip-card:focus .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            overflow: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
        .glossy-overlay { display: none !important; 
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 100%);
            pointer-events: none;
        }
    </style>
